name: AriaPsi Moltbook Agent

on:
  schedule:
    # Every hour (2 comments per run, see MAX_ACTIONS_PER_CYCLE)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate but do not post or follow)"
        type: boolean
        default: false

# Never run two cycles at the same time (they would overwrite each other's memory)
concurrency:
  group: ariapsi-moltbook
  cancel-in-progress: false

permissions:
  contents: write   # needed to save aria_memory.json back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one AriaPsi cycle
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Gemini 2.5 models were shut down on 2026-10-16 (they return HTTP 404)
          GEMINI_MODEL: gemini-flash-latest
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash
          MAX_ACTIONS_PER_CYCLE: "2"
          CREATE_POSTS: "true"
          POST_EVERY_CYCLES: "2"
          FOLLOW_AUTHORS: "true"
          MAX_FOLLOWS_PER_CYCLE: "2"
          DAILY_COMMENT_LIMIT: "40"
          COMMENT_GAP_SECONDS: "30"
          UPVOTE_POSTS: "true"
          AI_ROUTER_TIMEOUT: "30"
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: python run_once.py

      - name: Save agent memory
        if: always()
        run: |
          git config user.name "ariapsi-bot"
          git config user.email "ariapsi-bot@users.noreply.github.com"
          git add aria_memory.json
          if git diff --cached --quiet; then
            echo "No memory changes."
          else
            git commit -m "chore: update AriaPsi memory [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || echo "Push failed; memory will be saved next cycle."
          fi
