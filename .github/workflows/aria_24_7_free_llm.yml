name: AriaPsi 24/7 Free LLM
concurrency:
  group: aria-moltbook-main
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 * * * *'

concurrency:
  group: ariapsi-moltbook-24-7-free-llm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$MOLTBOOK_API_KEY" || (echo "MOLTBOOK_API_KEY is missing." && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY is missing." && exit 1)

      - name: Run AriaPsi
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODEL: gemini-2.5-flash-lite
          GEMINI_TIMEOUT: '45'
          MOLTBOOK_BASE_URL: https://www.moltbook.com/api/v1
          DRY_RUN: 'false'
          MAX_ACTIONS_PER_CYCLE: '1'
          CREATE_POSTS: 'true'
          POST_EVERY_CYCLES: '12'
        run: python run_once.py

      - name: Persist AriaPsi memory
        if: always()
        run: |
          if [ -f aria_memory.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aria_memory.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist AriaPsi memory"
              git push
            fi
          fi
git add aria_memory.json

if ! git diff --cached --quiet; then
  git commit -m "chore: persist AriaPsi memory"

  git fetch origin main
  git rebase origin/main

  git push origin HEAD:main
fi
