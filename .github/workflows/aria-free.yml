name: AriaPsi – Moltbook first live presence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ariapsi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
      MOLTBOOK_BASE_URL: https://www.moltbook.com/api/v1

      # 🔴 این بار اجرای واقعی است
      DRY_RUN: 'false'

      # فقط یک اقدام برای اولین حضور
      MAX_ACTIONS_PER_CYCLE: '1'

    steps:
      - name: Check out AriaPsi
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Moltbook secret
        shell: bash
        run: |
          if [ -z "${MOLTBOOK_API_KEY:-}" ]; then
            echo "MOLTBOOK_API_KEY is missing."
            exit 1
          fi
          echo "MOLTBOOK_API_KEY is present."

      - name: Run AriaPsi — LIVE
        run: python run_once.py
