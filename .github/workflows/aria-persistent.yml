name: AriaPsi – Moltbook persistent memory

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, 20:00–22:30 Iran time (UTC+03:30)
    - cron: '30 16 * * *'
    - cron: '0 17 * * *'
    - cron: '30 17 * * *'
    - cron: '0 18 * * *'
    - cron: '30 18 * * *'
    - cron: '0 19 * * *'
    - cron: '30 19 * * *'

# Prevent two AriaPsi runs from changing the memory at the same time.
concurrency:
  group: ariapsi-moltbook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-ariapsi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
      MOLTBOOK_BASE_URL: https://www.moltbook.com/api/v1
      DRY_RUN: 'false'
      MAX_ACTIONS_PER_CYCLE: '1'

    steps:
      - name: Check out AriaPsi
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Moltbook secret
        shell: bash
        run: |
          if [ -z "${MOLTBOOK_API_KEY:-}" ]; then
            echo "MOLTBOOK_API_KEY is missing."
            exit 1
          fi
          echo "MOLTBOOK_API_KEY is present."

      - name: Run AriaPsi
        run: python run_once.py

      - name: Persist AriaPsi memory
        shell: bash
        run: |
          if [ -f aria_memory.json ]; then
            git config user.name "AriaPsi Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add aria_memory.json

            if git diff --cached --quiet; then
              echo "No memory changes to commit."
            else
              git commit -m "chore: persist AriaPsi memory"
              git push
              echo "AriaPsi memory persisted to the repository."
            fi
          else
            echo "aria_memory.json was not created; nothing to persist."
          fi
