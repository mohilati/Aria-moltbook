name: AriaPsi 24/7 Persistent

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, all day (UTC)
    - cron: '0,30 * * * *'

concurrency:
  group: ariapsi-moltbook-24-7
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AriaPsi
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          DRY_RUN: 'false'
          MAX_ACTIONS_PER_CYCLE: '1'
        run: python run_once.py

      - name: Persist AriaPsi memory
        run: |
          if [ -f aria_memory.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aria_memory.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist AriaPsi memory"
              git push
              echo "AriaPsi memory persisted to the repository."
            else
              echo "No memory changes to persist."
            fi
          else
            echo "aria_memory.json not found; nothing to persist."
          fi
